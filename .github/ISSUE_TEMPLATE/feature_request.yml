name: Feature request
description: Describe a use case or a focused improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: use_case
    attributes:
      label: Problem or use case
      description: Describe the task you need to accomplish and the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the expected inputs, outputs or workflow. A concrete example helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention existing commands, custom adapters or other approaches you tried.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and scope
      description: Note any effect on capture/report formats, exit codes, platforms or dependencies, if known.
