name: Bug report
description: Report a reproducible problem in capture, comparison, packaging or documentation.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data. Captures include original strings, command arguments and diagnostics.
        For security concerns, follow SECURITY.md instead of posting technical details here.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Package version, Python version, OS/architecture and relevant Node/browser/toolchain versions.
      placeholder: Paste `collationdelta --version`, `python --version` and relevant runtime versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact command and a small synthetic corpus/profile, or steps for a documentation problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exit code and relevant sanitized output. Do not attach private captures.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and removed credentials and private data from this report.
          required: true
