name: Publish to PyPI

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    if: startsWith(github.event.release.tag_name || github.ref_name, 'v') && !github.event.release.prerelease
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import runpy
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          version = project['version']
          runtime_version = runpy.run_path('src/collationdelta/__init__.py')['__version__']
          if project['name'] != 'collationdelta' or os.environ['RELEASE_TAG'] != f'v{version}' or runtime_version != version:
              raise SystemExit('Release tag, package name, and version metadata must agree')
          PY
      - run: uv lock --check
      - run: uv build
      - run: uvx --from twine==6.2.0 twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Create GitHub Release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          base = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          tag = os.environ['RELEASE_TAG']

          def request(url, data=None, content_type='application/json'):
              req = urllib.request.Request(url, data=data, headers={**headers, 'Content-Type': content_type})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          try:
              release = request(f'{base}/releases/tags/{urllib.parse.quote(tag, safe="")}')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              notes = Path('CHANGELOG.md').read_text().split(f'## {tag[1:]}\n', 1)[1].split('\n## ', 1)[0].strip()
              release = request(f'{base}/releases', json.dumps({
                  'tag_name': tag,
                  'target_commitish': os.environ['GITHUB_SHA'],
                  'name': tag,
                  'body': notes,
                  'draft': False,
                  'prerelease': False,
              }).encode())
          existing = {asset['name'] for asset in release['assets']}
          upload = release['upload_url'].split('{', 1)[0]
          artifacts = sorted([*Path('dist').glob('*.whl'), *Path('dist').glob('*.tar.gz')])
          for artifact in artifacts:
              if artifact.name not in existing:
                  request(f'{upload}?name={urllib.parse.quote(artifact.name)}', artifact.read_bytes(), 'application/octet-stream')
          print(release['html_url'])
          PY

  publish:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/collationdelta/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
