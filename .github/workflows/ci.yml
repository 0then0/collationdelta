name: Python core and Node adapter
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --locked --python 3.10
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.10'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run --locked pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv lock --check
      - run: uv build
      - run: uvx --from twine==6.2.0 twine check --strict dist/*
      - name: Install wheel without dependencies and exercise installed CLI
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/collationdelta-install" --python 3.10
          uv pip install --no-deps --python "$RUNNER_TEMP/collationdelta-install/bin/python" dist/*.whl
          cli="$RUNNER_TEMP/collationdelta-install/bin/collationdelta"
          cd "$RUNNER_TEMP"
          "$cli" --help
          "$cli" capture --corpus "$GITHUB_WORKSPACE/examples/corpus.json" --profile "$GITHUB_WORKSPACE/examples/profile.json" --output baseline.json -- node "$("$cli" node-adapter)"
          PATH='' "$cli" compare baseline.json baseline.json --json-output report.json
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
